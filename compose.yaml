services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hovercv
      POSTGRES_DB: hovercv
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U hovercv -d hovercv]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  minio:
    build:
      context: .
      dockerfile: deploy/Dockerfile.minio
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
    volumes: [minio:/data]
    restart: unless-stopped
  setup:
    build:
      context: .
      target: builder
    env_file: .env
    environment:
      DATABASE_URL: postgresql://hovercv:${POSTGRES_PASSWORD}@db:5432/hovercv
      S3_ENDPOINT: http://minio:9000
      STORAGE_DRIVER: s3
    depends_on:
      db: { condition: service_healthy }
      minio: { condition: service_started }
    command: [node, --import, tsx, scripts/setup-services.ts]
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://hovercv:${POSTGRES_PASSWORD}@db:5432/hovercv
      S3_ENDPOINT: http://minio:9000
      STORAGE_DRIVER: s3
    depends_on:
      setup: { condition: service_completed_successfully }
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped
volumes:
  postgres:
  minio:
